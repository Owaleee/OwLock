[project]
name = "owlock"
version = "0.1.0"
description = "Gerenciador de senhas local e de código aberto, com cofre criptografado (Argon2id + AES-256-GCM)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "cryptography>=41",
  "argon2-cffi>=23.1",
  "pywebview>=5",
  "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
owlock = "owlock.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["owlock*"]

[tool.setuptools.package-data]
owlock = ["web/*.html", "web/*.css", "web/*.js", "web/fonts/*", "web/img/*", "web/icons/brands/*", "app/owlock.ico", "core/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["e2e", "node_modules"]
