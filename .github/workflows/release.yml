name: Release (executável Windows)

# Ao publicar uma Release no GitHub (aba Releases > Draft a new release),
# gera o OwLock.exe no Windows e o anexa à própria release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e ".[dev]" "pyinstaller>=6"
      - name: Testes
        run: pytest -q
      - name: Gerar executável
        run: >
          pyinstaller --noconfirm --onefile --windowed --name OwLock
          --icon packaging/owlock.ico --add-data "owlock/web;owlock/web" --add-data "owlock/app/owlock.ico;owlock/app" --add-data "owlock/core/data;owlock/core/data" --collect-all webview --collect-submodules keyring --paths .
          packaging/run_owlock.py
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          (cd dist && sha256sum OwLock.exe | tee OwLock.exe.sha256)
          gh release upload "$GITHUB_REF_NAME" dist/OwLock.exe dist/OwLock.exe.sha256 --clobber
