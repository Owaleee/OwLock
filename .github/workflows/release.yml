name: Release (executável Windows)

# Gera o OwLock.exe no Windows e publica a release:
# - ao enviar uma tag de versão (ex.: git tag v1.0.0 && git push origin v1.0.0), cria a release
#   com as notas de docs/releases/<tag>.md e anexa os arquivos;
# - ao publicar uma Release pela aba Releases do GitHub, anexa os arquivos a ela.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e ".[dev]" "pyinstaller>=6"
      - name: Testes
        run: pytest -q
      - name: Conferir a versão
        shell: bash
        run: |
          app=$(python -c "import owlock; print(owlock.__version__)")
          test "v$app" = "$GITHUB_REF_NAME" || { echo "A tag $GITHUB_REF_NAME não confere com a versão $app"; exit 1; }
      - name: Gerar executável
        run: >
          pyinstaller --noconfirm --onefile --windowed --name OwLock
          --icon packaging/owlock.ico --add-data "owlock/web;owlock/web" --add-data "owlock/app/owlock.ico;owlock/app" --add-data "owlock/core/data;owlock/core/data" --collect-all webview --collect-all pystray --collect-submodules keyring --paths .
          packaging/run_owlock.py
      - name: Gerar instalador
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = python -c "import owlock; print(owlock.__version__)"
          & $iscc "/DAppVersion=$version" packaging\owlock.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash SHA-256
        shell: bash
        run: (cd dist && sha256sum OwLock.exe OwLock-Setup.exe | tee SHA256SUMS.txt && sha256sum OwLock.exe > OwLock.exe.sha256)
      - name: Publicar na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          files="dist/OwLock-Setup.exe dist/OwLock.exe dist/OwLock.exe.sha256 dist/SHA256SUMS.txt"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            notes="docs/releases/$GITHUB_REF_NAME.md"
            title=$(head -n 1 "$notes" | sed 's/^# *//')
            tail -n +2 "$notes" > /tmp/notes.md
            gh release create "$GITHUB_REF_NAME" $files --title "$title" --notes-file /tmp/notes.md --verify-tag
          fi
