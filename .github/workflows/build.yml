name: Build (executável e instalador)

# Gera o OwLock.exe e o OwLock-Setup.exe sem publicar nada, para testar antes de uma release.
# Roda quando o empacotamento muda ou manualmente (aba Actions > Build > Run workflow).
# Os arquivos ficam em "Artifacts" na página da execução.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e ".[dev]" "pyinstaller>=6"
      - name: Gerar executável
        run: >
          pyinstaller --noconfirm --onefile --windowed --name OwLock
          --icon packaging/owlock.ico --add-data "owlock/web;owlock/web" --add-data "owlock/app/owlock.ico;owlock/app" --add-data "owlock/core/data;owlock/core/data" --collect-all webview --collect-all pystray --collect-submodules keyring --paths .
          packaging/run_owlock.py
      - name: Gerar instalador
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = python -c "import owlock; print(owlock.__version__)"
          & $iscc "/DAppVersion=$version" packaging\owlock.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: OwLock-windows
          path: |
            dist/OwLock.exe
            dist/OwLock-Setup.exe
